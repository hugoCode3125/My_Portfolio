<nav class="navbar" [class.scrolled]="scrolled()">
  <div class="nav-container">
    <div class="nav-brand" (click)="navigate('hero')">
      <span class="brand-icon">&lt;/&gt;</span>
      <span class="brand-text">Hugues Fawzi Ouedraogo</span>
    </div>

    <ul class="nav-links" [class.open]="menuOpen()">
      @for (item of navItems; track item.section) {
        <li>
          <button class="nav-btn" (click)="navigate(item.section)">
            {{ item.label }}
          </button>
        </li>
      }
    </ul>

    <div class="nav-actions">
      <button class="theme-toggle" (click)="themeService.toggle()" [title]="themeService.isDark() ? 'Mode clair' : 'Mode sombre'">
        @if (themeService.isDark()) {
          <span>☀️</span>
        } @else {
          <span>🌙</span>
        }
      </button>

      <button class="hamburger" (click)="toggleMenu()" [class.active]="menuOpen()">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</nav>
